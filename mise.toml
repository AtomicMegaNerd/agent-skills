[tools]
node = "latest"
oxfmt = "latest"
markdownlint-cli2 = "latest"
pre-commit = "latest"

[tasks.setup]
description = "Generate .pre-commit-config.yaml and install git hooks"
run = """
cat > .pre-commit-config.yaml << 'EOF'
repos:
  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        language: system
        entry: oxfmt
        args: ["."]
        pass_filenames: false

      - id: markdownlint-cli2
        name: markdownlint-cli2
        language: system
        entry: markdownlint-cli2
        types: [markdown]

EOF
pre-commit install
"""
